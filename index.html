<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ombuds — senior care, checked against the public record</title>
    <meta
      name="description"
      content="Ombuds ranks nearby senior care facilities by their federal inspection record and emails each one to ask what is never published. We take no money from facilities."
    />

    <!--
      The tab icon. There was none, so every judge with this open beside eleven
      other submissions got the browser's blank page glyph. The file carries its
      own prefers-color-scheme rule, because a favicon is an isolated document
      that cannot see the page's theme — it follows the operating system, which
      is the best a tab icon can do.
    -->
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />

    <!--
      Public Sans is the typeface of the US Web Design System, which is where
      the accent blue in this product comes from too. A page that reads federal
      records to a family should be set in the face those records are published
      in. IBM Plex Mono carries the parts that are codes rather than words —
      F0689, a scope/severity letter, a certification number.

      Linked here rather than @import-ed from the stylesheet so the browser can
      start fetching both while it is still parsing this file, instead of
      waiting for the CSS to arrive first. The fallback stack in index.css is
      real: if these never load, the page is plainer and entirely readable.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300..800;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    />
  </head>
  <body class="h-full">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
